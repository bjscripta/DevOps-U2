name: Deploy to ECS
 
on:
  push:
    branches:
      - main
 
env:
  AWS_REGION: us-east-1
  ECR_URL: 851725168010.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: innovatech-spa-cluster
 
jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
 
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Login a ECR
        uses: aws-actions/amazon-ecr-login@v1
 
      - name: Build y Push Frontend
        working-directory: front_despacho
        run: |
          docker build -t $ECR_URL/innovatech-spa-frontend:latest .
          docker push $ECR_URL/innovatech-spa-frontend:latest
 
      - name: Deploy Frontend en ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service innovatech-spa-frontend-service \
            --force-new-deployment \
            --region $AWS_REGION
 
  deploy-backend-ventas:
    name: Deploy Backend Ventas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
 
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Login a ECR
        uses: aws-actions/amazon-ecr-login@v1
 
      - name: Build y Push Backend Ventas
        working-directory: backend/Springboot-API-REST-VENTAS
        run: |
          docker build -t $ECR_URL/innovatech-spa-backend:latest .
          docker push $ECR_URL/innovatech-spa-backend:latest
 
      - name: Deploy Backend Ventas en ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service innovatech-spa-backend-ventas-service \
            --force-new-deployment \
            --region $AWS_REGION
 
  deploy-backend-despacho:
    name: Deploy Backend Despacho
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
 
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
 
      - name: Login a ECR
        uses: aws-actions/amazon-ecr-login@v1
 
      - name: Build y Push Backend Despacho
        working-directory: backend/Springboot-API-REST-DESPACHO
        run: |
          docker build -t $ECR_URL/innovatech-spa-backend-despacho:latest .
          docker push $ECR_URL/innovatech-spa-backend-despacho:latest
 
      - name: Deploy Backend Despacho en ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service innovatech-spa-backend-despacho-service \
            --force-new-deployment \
            --region $AWS_REGION
 